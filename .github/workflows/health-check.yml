name: Published status contract health check

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch published Pages contract
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://kafka2306.github.io/nonfarmpayroll/ \
            --output /tmp/index.html
          curl --fail --silent --show-error --location \
            https://kafka2306.github.io/nonfarmpayroll/status.json \
            --output /tmp/status.json

      - name: Validate fail-closed publication
        run: |
          set -euo pipefail
          grep -q '改定分析は利用不可' /tmp/index.html
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(Path('/tmp/status.json').read_text(encoding='utf-8'))
          assert status['analysis_available'] is False
          assert status['legacy_synthetic_artifacts_trusted'] is False
          print(json.dumps(status, ensure_ascii=False, sort_keys=True))
          PY

          if grep -Eiq '112\.3|73\.4|\+17K|17\.1|95/100|99\.9%|fully automated|ready to use' /tmp/index.html; then
            echo '::error::Retracted or unverified claim is visible on GitHub Pages.' >&2
            exit 1
          fi

      - name: Health summary
        run: |
          echo '## Published status contract' >> "$GITHUB_STEP_SUMMARY"
          echo '- HTTP fetch: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- analysis_available=false: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- legacy_synthetic_artifacts_trusted=false: PASS' >> "$GITHUB_STEP_SUMMARY"
          echo '- retracted metrics absent: PASS' >> "$GITHUB_STEP_SUMMARY"
