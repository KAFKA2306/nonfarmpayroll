name: Validate verified browser explorer

on:
  pull_request:
    paths:
      - docs/explorer/**
      - docs/api/v1/**
      - tests/test_browser_level_explorer.py
      - .github/workflows/browser-explorer.yml
  push:
    branches: [main]
    paths:
      - docs/explorer/**
      - docs/api/v1/**
      - tests/test_browser_level_explorer.py
      - .github/workflows/browser-explorer.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile and test fail-closed explorer core
        run: |
          python -m py_compile docs/explorer/level_explorer.py tests/test_browser_level_explorer.py
          python -m unittest tests.test_browser_level_explorer -v
      - name: Validate browser boundary
        run: |
          node --check docs/explorer/app.js
          node --check docs/explorer/worker.mjs
          grep -q 'type:' docs/explorer/app.js
          grep -q 'v314.0.2' docs/explorer/worker.mjs
          ! grep -Eq 'payroll-(revisions|vintages)' docs/explorer/app.js docs/explorer/worker.mjs docs/explorer/level_explorer.py
      - name: Verify clean checkout
        run: |
          rm -rf docs/explorer/__pycache__ tests/__pycache__
          test -z "$(git status --porcelain --untracked-files=all)"
